# Rollout de Argo Rollouts en vez de Deployment estandar (Practica 8,
# "Entrega progresiva"). Solo api-gateway usa Rollout — es el unico punto
# de entrada de la plataforma, asi que un fallo aqui es facil de demostrar
# con un curl y de ver detenido por el analisis antes de llegar al 100% del
# trafico. Los otros 5 servicios se quedan con Deployment normal (P5).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "api-gateway.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      # El trafico real sigue siendo "basic canary" via el Service
      # principal (sin TrafficRouting/service mesh) — canaryService aqui
      # NO reparte trafico de usuarios, solo le da al AnalysisTemplate un
      # Service que Argo Rollouts mantiene apuntando exclusivamente a los
      # pods canary, para que el chequeo de salud nunca golpee por
      # accidente un pod de la revision estable (ver templates/service.yaml).
      stableService: {{ include "api-gateway.fullname" . }}
      canaryService: {{ include "api-gateway.fullname" . }}-canary
      # El paso "analysis" queda al final a proposito: Argo Rollouts
      # promueve automaticamente al 100% en cuanto el ultimo paso declarado
      # termina exitosamente, asi que no hace falta un setWeight:100 explicito
      # despues del analisis — y si el analisis falla (al 50% de trafico),
      # el Rollout aborta ahi mismo y nunca llega a exponer mas del 50%.
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 10s
        - analysis:
            templates:
              - templateName: {{ include "api-gateway.fullname" . }}-canary-analysis
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "api-gateway.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "api-gateway.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ required "api-gateway: falta definir image.tag en values-images.yaml" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "api-gateway.fullname" . }}-config
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
