{{/*
El consumidor y los 2 cronjobs de este subchart nunca llaman a la API de
Kubernetes (solo hablan con Postgres y RabbitMQ), asi que tienen su PROPIA
ServiceAccount cada uno — sin Role, sin RoleBinding, y sin montar el
token. Separados de la ServiceAccount del servidor HTTP (que si tiene un
Role minimo, ver templates/role.yaml) porque son identidades con
necesidades distintas aunque compartan chart e imagen.
*/}}
{{/* No depende de .Values.serviceAccount.create (esa gobierna solo la SA
del servidor HTTP, que ahora crea Terraform) — estas 3 no tienen Role ni
RoleBinding, asi que no compiten con nada que Terraform administre. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reportes-service.fullname" . }}-consumer
  labels:
    {{- include "reportes-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: consumer
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reportes-service.fullname" . }}-cronjob-heartbeat
  labels:
    {{- include "reportes-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: cronjob-heartbeat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reportes-service.fullname" . }}-cronjob-resumen
  labels:
    {{- include "reportes-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: cronjob-resumen
automountServiceAccountToken: false
