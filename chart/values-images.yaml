# Unico archivo que el pipeline de CI modifica automaticamente (via Pull
# Request, nunca con un push directo ni con "helm upgrade" contra el
# cluster). Cada release crea un tag de Git (vX.Y.Z); el workflow construye,
# firma y publica la imagen con ESE tag exacto (nunca "latest", ver Practica
# 8 seccion 3.2) y abre un PR que solo cambia las lineas "tag:" de aqui.
#
# ArgoCD sincroniza este repo automaticamente -> al mergear el PR, la nueva
# version se despliega via Argo Rollouts sin que nadie ejecute kubectl ni
# helm contra el cluster.

api-gateway:
  image:
    repository: ghcr.io/tefianaide/pr-cticas-sa-b-202300547/p8-api-gateway
    tag: "v0.2.1"

