# Credenciales S3 de Velero para MinIO (almacenamiento externo, Practica 9).
# Sellado SIN conexion al cluster con la llave publica respaldada:
#   kubeseal --cert ~/.sa-p9/sealed-secrets/<llave>.crt --format yaml
# Solo un controlador con la llave privada restaurada puede descifrarlo.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  encryptedData:
    cloud: 
  template:
    metadata:
      name: velero-credentials
      namespace: velero
