# Backend de trazas (Practica 10). Tempo single binary, almacenamiento
# local, retencion 24 h. Solo recibe OTLP: lo que llega viene del OTel
# Collector (otlp/tempo -> tempo:4317). Grafana lo consulta en :3200.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      valuesObject:
        fullnameOverride: tempo
        tempo:
          retention: 24h
          # Solo OTLP: los receptores de Jaeger/OpenCensus del default no
          # tienen emisor en este sistema.
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
        persistence:
          enabled: true
          size: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
