# =============================================================================
# App-of-apps de la Practica 9. La aplicacion raiz "sa-p9-root" (creada por
# Terraform, P9/terraform/argocd.tf) sincroniza ESTA carpeta; cada archivo
# es una Application hija. El orden de reconstruccion lo dan las sync-waves:
#
#   -3  sealed-secrets        descifra todo lo demas (con la llave restaurada)
#   -2  argo-rollouts, kyverno   CRDs/controladores que usan las olas siguientes
#   -1  velero-credenciales   SealedSecret con las credenciales de MinIO
#    0  velero (+Schedule), politicas-kyverno
#    1  sa-p8                 la plataforma de microservicios (Practicas 5-8)
#
# Una ola empieza solo cuando la anterior esta Healthy (health check de
# Application definido en P9/terraform/values/argocd.yaml).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      valuesObject:
        # Mismo nombre que en la Practica 8 (kubeseal --controller-name sealed-secrets).
        fullnameOverride: sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
