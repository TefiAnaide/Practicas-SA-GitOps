# OpenTelemetry Collector (Practica 10) — un agente por nodo (DaemonSet).
#
#   Entradas
#     otlp      trazas y metricas que los servicios envian con el SDK de
#               OpenTelemetry (OTEL_EXPORTER_OTLP_ENDPOINT -> :4318)
#     filelog   registros JSON que los servicios escriben a stdout
#               (/var/log/pods/sa-p8_*), leidos en el nodo donde corren
#   Enriquecimiento
#     k8sattributes  agrega namespace, pod, deployment, nodo y la etiqueta
#                    rollouts-pod-template-hash -> el AnalysisTemplate del
#                    canary puede separar las metricas de la version nueva
#   Salidas
#     trazas   -> Tempo  (otlp, tempo:4317)
#     registros-> Loki   (otlphttp, loki:3100/otlp)
#     metricas -> endpoint Prometheus :8889 del propio agente, que
#                 Prometheus raspa con un PodMonitor
#
# Por que DaemonSet y no Deployment: filelog debe leer los archivos del
# nodo; y con el Service en internalTrafficPolicy=Local cada pod envia al
# agente de SU nodo, que ve la IP real del pod y puede asociarle sus
# atributos de Kubernetes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.176.0
    helm:
      valuesObject:
        fullnameOverride: otel-collector
        mode: daemonset
        image:
          repository: otel/opentelemetry-collector-contrib
        service:
          enabled: true
        presets:
          logsCollection:
            enabled: true
            includeCollectorLogs: false
          kubernetesAttributes:
            enabled: true
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
        ports:
          jaeger-compact: {enabled: false}
          jaeger-thrift: {enabled: false}
          jaeger-grpc: {enabled: false}
          zipkin: {enabled: false}
          otlp: {hostPort: null}
          otlp-http: {hostPort: null}
          metrics: {enabled: true}
          promexporter:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
        podMonitor:
          enabled: true
          metricsEndpoints:
            - port: promexporter
              interval: 15s
        config:
          receivers:
            filelog:
              # Solo la plataforma: los registros del propio stack no
              # responden ninguna pregunta de operacion de los servicios.
              include:
                - /var/log/pods/sa-p8_*/*/*.log
              exclude: []
            jaeger: null
            zipkin: null
            prometheus: null
          processors:
            k8sattributes:
              extract:
                metadata:
                  - k8s.namespace.name
                  - k8s.pod.name
                  - k8s.deployment.name
                  - k8s.node.name
                  - k8s.container.name
                labels:
                  - tag_name: rollouts_pod_template_hash
                    key: rollouts-pod-template-hash
                    from: pod
                  - tag_name: app
                    key: app.kubernetes.io/name
                    from: pod
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
          exporters:
            otlp/tempo:
              endpoint: tempo.observabilidad.svc:4317
              tls:
                insecure: true
            otlphttp/loki:
              endpoint: http://loki.observabilidad.svc:3100/otlp
            prometheus:
              endpoint: 0.0.0.0:8889
              # Atributos de recurso (service.name, k8s.pod.name,
              # rollouts_pod_template_hash...) como etiquetas de la metrica.
              resource_to_telemetry_conversion:
                enabled: true
              metric_expiration: 10m
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, k8sattributes, batch]
                exporters: [otlp/tempo]
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, k8sattributes, batch]
                exporters: [prometheus]
              logs:
                receivers: [filelog]
                processors: [memory_limiter, k8sattributes, batch]
                exporters: [otlphttp/loki]
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
